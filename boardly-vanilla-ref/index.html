<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Boardly — A beautiful, premium Kanban task board for organizing your work with drag & drop, multiple boards, and smart filters.">
  <title>Boardly — Kanban Task Board</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
</head>
<body>

  <div id="app">
    <!-- ═══ Sidebar ═══ -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">⚡</div>
          <h1>Boardly</h1>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Your Boards</div>
        <ul id="board-list" class="board-list">
          <!-- Rendered by JS -->
        </ul>
        <button id="add-board-btn" class="add-board-btn">
          <span>＋</span> New Board
        </button>
      </div>
    </aside>

    <!-- ═══ Main Area ═══ -->
    <div class="main-area">

      <!-- ── Top Bar ── -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Toggle sidebar">☰</button>
          <input type="text" id="board-title" class="board-title" spellcheck="false" placeholder="Board Title">
        </div>
        <div class="topbar-center">
          <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search cards...">
          </div>
        </div>
        <div class="topbar-right">
          <button id="filter-btn" class="filter-btn">
            <span>⚙</span> Filter
          </button>
          <div id="filter-dropdown" class="filter-dropdown">
            <button class="filter-option" data-priority="urgent">
              <span class="filter-dot" style="background: var(--priority-urgent)"></span>
              Urgent
            </button>
            <button class="filter-option" data-priority="high">
              <span class="filter-dot" style="background: var(--priority-high)"></span>
              High
            </button>
            <button class="filter-option" data-priority="medium">
              <span class="filter-dot" style="background: var(--priority-medium)"></span>
              Medium
            </button>
            <button class="filter-option" data-priority="low">
              <span class="filter-dot" style="background: var(--priority-low)"></span>
              Low
            </button>
          </div>
        </div>
      </header>

      <!-- ── Board Content (Columns) ── -->
      <div id="board-content" class="board-content">
        <!-- Rendered by JS -->
      </div>

    </div>
  </div>

  <!-- ═══ Card Modal ═══ -->
  <div id="card-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="card-modal-title" class="modal-title">New Card</h2>
        <button id="card-modal-close" class="modal-close-btn" title="Close">✕</button>
      </div>
      <form id="card-form" class="modal-body">
        <div class="form-group">
          <label class="form-label" for="card-title-input">Title</label>
          <input type="text" id="card-title-input" placeholder="Enter card title..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="card-desc-input">Description</label>
          <textarea id="card-desc-input" placeholder="Add a description..." rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="card-priority-input">Priority</label>
            <select id="card-priority-input">
              <option value="urgent">🔴 Urgent</option>
              <option value="high">🟠 High</option>
              <option value="medium" selected>🔵 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="card-due-date-input">Due Date</label>
            <input type="date" id="card-due-date-input">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="card-delete-btn" class="btn btn-danger" style="display: none; margin-right: auto;">🗑️ Delete</button>
          <button type="button" id="card-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">💾 Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══ Scripts ═══ -->
  <script src="js/board.js"></script>
  <script src="js/dragdrop.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
